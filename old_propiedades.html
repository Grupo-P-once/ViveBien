<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vive Bien – Grupo Inmobiliario | León, Guanajuato</title>

  <!-- Esta versión del sitio quedó atrás en la migración de marzo de 2026.
       El sitio actual vive en vive-bien.vercel.app -->
  <link rel="canonical" href="https://vive-bien.vercel.app/" />
  <meta http-equiv="refresh" content="0; url=https://vive-bien.vercel.app/" />
  <meta name="robots" content="noindex, follow" />

  <meta name="description"
    content="Vive Bien Grupo Inmobiliario: naves industriales, terrenos y casas en León, Guanajuato." />
  <link rel="icon" href="logo_transparent.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Open+Sans:wght@400;600&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      --rojo: #8B1A1A;
      --azul: #1B365D;
      --gris: #F4F6F8;
      --texto: #222831;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Open Sans', system-ui, sans-serif;
      background: var(--gris);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      line-height: 1.6;
    }

    .tarjeta {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
      max-width: 460px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    img.logo {
      height: 84px;
      object-fit: contain;
      margin: 0 auto 1.5rem;
      display: block;
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--azul);
      margin-bottom: .75rem;
      text-wrap: balance;
    }

    p {
      font-size: .95rem;
      color: #555;
      margin-bottom: 1.75rem;
    }

    a.boton {
      display: inline-block;
      background: var(--rojo);
      color: #fff;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: .95rem;
      padding: 14px 30px;
      border-radius: 9px;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    a.boton:hover,
    a.boton:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(139, 26, 26, .28);
    }

    .pie {
      margin-top: 1.75rem;
      font-size: .8rem;
      color: #999;
    }

    .pie a { color: #777; }
  </style>
</head>

<body>
  <main class="tarjeta">
    <img class="logo" src="logo_transparent.png" alt="Vive Bien Grupo Inmobiliario" />
    <h1>Nos mudamos de casa</h1>
    <p>
      El sitio de Vive Bien está ahora en una dirección nueva.
      Te llevamos allí en un momento.
    </p>
    <a class="boton" href="https://vive-bien.vercel.app/">Ir al sitio</a>
    <p class="pie">
      Si no te redirige solo:
      <a href="https://vive-bien.vercel.app/">vive-bien.vercel.app</a>
    </p>
  </main>

  <script>
    // Respaldo por si el navegador ignora el meta refresh.
    setTimeout(function () {
      window.location.replace('https://vive-bien.vercel.app/');
    }, 1200);
  </script>
</body>

</html>
